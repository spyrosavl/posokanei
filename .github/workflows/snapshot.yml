name: Daily snapshot

on:
  schedule:
    # 04:30 UTC daily (~07:30 Greece). Cron times are UTC and best-effort.
    - cron: "30 4 * * *"
    # Safety net six hours later, for days the morning run fails or is starved
    # by GitHub's scheduler. It exits early unless today's snapshot is actually
    # missing, so on a normal day it costs one checkout and nothing more.
    - cron: "30 10 * * *"
  workflow_dispatch: {}

# Allow the job to push the new snapshot back to the repo.
permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    # A healthy run takes ~10-15 min. Without this the job inherits GitHub's
    # 6-hour default, which is how the 2026-08-19 run sat hung all morning
    # before being killed. Per-step limits below fail closer to the cause.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # The retry cron must not re-take a snapshot that already succeeded:
      # prices and `fetched_at` drift during the day, so the commit step would
      # always see a diff and would overwrite the morning's capture. Manual
      # runs still force a re-take, matching fetch.py's idempotent-rerun design.
      - name: Decide whether today's snapshot is still needed
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          TODAY=$(date -u +%Y-%m-%d)
          FILE="data/${TODAY%%-*}/posokanei-${TODAY}.json"
          if [ "$EVENT_NAME" != "schedule" ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "Manual run — taking the snapshot regardless of $FILE."
          elif [ -f "$FILE" ]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "$FILE already present — nothing to do."
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "$FILE missing — taking the snapshot."
          fi

      - uses: actions/setup-python@v5
        if: steps.check.outputs.needed == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install chart dependencies
        if: steps.check.outputs.needed == 'true'
        run: pip install -r requirements.txt

      # Offline: runs against archived snapshots, so it fails fast before we
      # bother bringing up the VPN.
      - name: Test fetch logic
        if: steps.check.outputs.needed == 'true'
        run: python test_fetch.py

      - name: Connect to Greece via NordVPN (OpenVPN)
        if: steps.check.outputs.needed == 'true'
        # Worst case is bounded by construction: apt 90+120+120s, then 3 servers
        # x (20s config + 60s wait) = ~9.5 min. Healthy runs take well under 1.
        timeout-minutes: 12
        env:
          NORDVPN_USER: ${{ secrets.NORDVPN_USER }}
          NORDVPN_PASS: ${{ secrets.NORDVPN_PASS }}
        run: |
          set -euo pipefail

          # `apt-get update` is what hung the 2026-08-19 runs — once for 5h59m
          # until the job limit killed it. The runner's azure.archive.ubuntu.com
          # mirror was refusing (Ign: lines), apt fell back to archive.ubuntu.com
          # and stalled there with no per-connection timeout of its own.
          # So: bound every acquisition, wrap each call in `timeout`, and try the
          # image's existing package index before refreshing it at all.
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15"
          if ! sudo timeout 90 apt-get $APT install -y --no-install-recommends openvpn jq; then
            echo "install from the cached index failed; refreshing it and retrying"
            sudo timeout 120 apt-get $APT update || true
            sudo timeout 120 apt-get $APT install -y --no-install-recommends openvpn jq
          fi
          openvpn --version | head -1 || true   # openvpn --version exits 1

          # Every curl here is bounded too: unbounded ones were a latent hang
          # waiting to happen, even though apt is what actually fired.
          CURL="curl -sS --max-time 20 --retry 3 --retry-delay 2 --retry-all-errors"

          # Several recommended Greek servers (country_id 84 = Greece): an
          # individual host is sometimes unreachable, so we fall through to the
          # next rather than failing the whole day's snapshot.
          $CURL "https://api.nordvpn.com/v1/servers/recommendations?filters%5Bcountry_id%5D=84&limit=3" \
            | jq -r '.[].hostname' > hosts.txt
          echo "Candidate servers:"; cat hosts.txt

          printf '%s\n%s\n' "$NORDVPN_USER" "$NORDVPN_PASS" > auth.txt
          chmod 600 auth.txt

          connected=""
          while read -r HOST; do
            echo "--- trying $HOST"
            sudo killall openvpn 2>/dev/null || true
            if ! $CURL -f -o gr.ovpn "https://downloads.nordcdn.com/configs/files/ovpn_udp/servers/${HOST}.udp.ovpn"; then
              echo "    could not download config for $HOST"
              continue
            fi
            sudo openvpn --config gr.ovpn --auth-user-pass auth.txt \
              --daemon --log vpn.log --writepid vpn.pid
            # Wait up to 60s for the tunnel to land in Greece.
            for i in $(seq 1 30); do
              CC=$(curl -s --max-time 5 https://ipinfo.io/country || true)
              if [ "$CC" = "GR" ]; then
                connected="$HOST"
                break
              fi
              sleep 2
            done
            if [ -n "$connected" ]; then
              break
            fi
            echo "    $HOST did not come up. Last lines of the OpenVPN log:"
            sudo tail -n 20 vpn.log || true
          done < hosts.txt

          rm -f auth.txt
          if [ -z "$connected" ]; then
            echo "No Greek NordVPN server reachable after $(wc -l < hosts.txt | tr -d ' ') attempts."
            exit 1
          fi
          echo "Tunnel up via $connected — exit IP is in: GR"

      # fetch.py already retries each request 5x with backoff and caps every
      # request at 60s, so this bounds the crawl as a whole (~15 min healthy).
      - name: Fetch snapshot
        if: steps.check.outputs.needed == 'true'
        timeout-minutes: 25
        run: python fetch.py

      - name: Disconnect VPN
        if: always() && steps.check.outputs.needed == 'true'
        run: sudo killall openvpn || true

      - name: Render chart
        if: steps.check.outputs.needed == 'true'
        run: python chart.py

      - name: Compute stats
        if: steps.check.outputs.needed == 'true'
        run: python stats.py

      - name: Commit snapshot
        if: steps.check.outputs.needed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data assets docs
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Snapshot $(date -u +%Y-%m-%d)"
            git push
          fi
